<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>import</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fragment+Mono&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root { --fg:#111; --muted:#666; --border:#ccc; --danger:#b3261e; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: "Fragment Mono", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", monospace; font-size:12px; color:var(--fg); background:#fff; }
  #root { max-width:480px; margin:0 auto; padding:16px; line-height:1.7; }
  h1 { font-size:12px; font-weight:700; margin:0 0 12px; }
  .box { border-top:1px solid #e5e5e5; padding:14px 0; }
  .muted { color:var(--muted); }
  .err { color:var(--danger); }
  button, input { font-family:inherit; font-size:12px; }
  .btn { padding:10px 14px; border-radius:6px; border:1px solid var(--fg); background:var(--fg); color:#fff; cursor:pointer; }
  .btn:disabled { opacity:.4; cursor:not-allowed; }
  .btn.ghost { background:#fff; color:var(--fg); border-color:var(--border); }
  .bar { height:6px; background:#eee; border-radius:3px; overflow:hidden; margin:8px 0; }
  .bar > div { height:100%; width:0; background:var(--fg); transition:width .2s; }
  a { color:var(--fg); }
</style>
</head>
<body>
<div id="root">
  <h1>import</h1>
  <div id="need-login" class="box hidden-box" style="display:none;">
    <div class="err">로그인이 필요합니다.</div>
    <div><a href="/">메인 페이지</a>에서 로그인한 뒤 이 페이지를 다시 열어주세요.</div>
  </div>

  <div id="main" style="display:none;">
    <div class="box">
      <div class="muted">1. csv 파일 선택</div>
      <input type="file" id="file" accept=".csv,text/csv" />
      <div id="summary" class="muted" style="margin-top:8px;"></div>
      <div style="margin-top:10px;"><button class="btn" id="btn-import" disabled>import</button></div>
      <div class="bar"><div id="bar1"></div></div>
      <div id="status1" class="muted"></div>
    </div>

    <div class="box">
      <div class="muted">2. 이미지 가져오기 (csv에는 이미지가 없어서 상품 페이지에서 가져옵니다)</div>
      <div class="muted">이미지가 비어 있는 아이템만 대상입니다. 끝날 때까지 이 화면을 켜두세요. 중간에 멈춰도 다시 누르면 이어서 합니다.</div>
      <div style="margin-top:10px;">
        <button class="btn" id="btn-images">fetch images</button>
        <button class="btn ghost" id="btn-stop" disabled>stop</button>
      </div>
      <div class="bar"><div id="bar2"></div></div>
      <div id="status2" class="muted"></div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";
  var sb = window.supabase.createClient("https://ukjbqpezqzgfbmgtyltp.supabase.co", "sb_publishable_vziMDIRtG4w-jz9Uc3h0yA_clIQqKYD");
  function $(id) { return document.getElementById(id); }

  // ---------- CSV 파서 (따옴표, 쉼표, 줄바꿈 처리) ----------
  function parseCSV(text) {
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    var rows = [], row = [], cur = "", inQ = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (inQ) {
        if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else inQ = false; }
        else cur += c;
      } else if (c === '"') inQ = true;
      else if (c === ",") { row.push(cur); cur = ""; }
      else if (c === "\n") { row.push(cur); rows.push(row); row = []; cur = ""; }
      else if (c !== "\r") cur += c;
    }
    if (cur !== "" || row.length) { row.push(cur); rows.push(row); }
    return rows;
  }
  function hostnameOf(url) { try { return new URL(url).hostname.replace(/^www\./, ""); } catch (e) { return ""; } }

  var parsed = [];   // 가져올 항목들
  var skippedDup = 0;

  // ---------- 로그인 확인 ----------
  sb.auth.getSession().then(function (res) {
    if (res.data && res.data.session) { $("main").style.display = "block"; }
    else { $("need-login").style.display = "block"; }
  });

  // ---------- 1단계: csv 읽기 ----------
  $("file").addEventListener("change", function () {
    var f = this.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function () {
      var rows = parseCSV(String(reader.result));
      var head = rows[0] || [];
      var idx = function (name) { return head.indexOf(name); };
      var iTitle = idx("상품명"), iStore = idx("스토어명"), iList = idx("정가"), iSale = idx("할인가"),
          iDate = idx("등록일"), iBucket = idx("버킷명"), iOwn = idx("소장템 여부"), iUrl = idx("상품 링크");
      if (iUrl < 0 || iTitle < 0) { $("summary").innerHTML = '<span class="err">형식이 달라요. 위시버킷에서 내보낸 csv가 맞는지 확인해주세요.</span>'; return; }

      var byUrl = {}; parsed = []; skippedDup = 0;
      rows.slice(1).forEach(function (r) {
        var url = (r[iUrl] || "").trim();
        if (!url) return;
        var price = (r[iSale] || "").trim() || (r[iList] || "").trim();
        var date = (r[iDate] || "").trim();
        var created = date ? new Date(date.replace(" ", "T") + "+09:00") : null;
        var item = {
          url: url,
          title: (r[iTitle] || "").trim() || null,
          image: null,
          price: price || null,
          currency: price ? "KRW" : null,
          site: (r[iStore] || "").trim() || hostnameOf(url),
          category: (r[iBucket] || "").trim() || null,
          purchased: (r[iOwn] || "").trim().toUpperCase() === "Y",
          created_at: created && !isNaN(created) ? created.toISOString() : null
        };
        var prev = byUrl[url];
        if (prev) {
          // 같은 링크가 또 나오면 하나로 합치되, 있는 정보는 살린다 (카테고리, 소장 여부, 이름, 가격)
          skippedDup++;
          if (!prev.category && item.category) prev.category = item.category;
          if (item.purchased) prev.purchased = true;
          if (!prev.title && item.title) prev.title = item.title;
          if (!prev.price && item.price) { prev.price = item.price; prev.currency = item.currency; }
          return;
        }
        byUrl[url] = item;
        parsed.push(item);
      });
      var bought = parsed.filter(function (p) { return p.purchased; }).length;
      $("summary").textContent = "총 " + parsed.length + "개 (이미 산 아이템 " + bought + "개 포함, 같은 링크 " + skippedDup + "개는 하나로 합침)";
      $("btn-import").disabled = parsed.length === 0;
    };
    reader.readAsText(f, "utf-8");
  });

  // ---------- 1단계: 저장 ----------
  $("btn-import").addEventListener("click", function () {
    var btn = this; btn.disabled = true;
    $("status1").textContent = "기존 목록 확인 중…";
    loadExistingUrls().then(function (existing) {
      var todo = parsed.filter(function (p) { return !existing[p.url]; });
      var already = parsed.length - todo.length;
      if (todo.length === 0) { $("status1").textContent = "새로 넣을 항목이 없습니다. (이미 저장됨 " + already + "개)"; return; }
      var done = 0, failed = 0, B = 100;
      function next() {
        if (done + failed >= todo.length) {
          $("status1").textContent = "완료: " + done + "개 저장" + (already ? ", 이미 있던 " + already + "개 건너뜀" : "") + (failed ? ", 실패 " + failed + "개" : "");
          return;
        }
        var batch = todo.slice(done + failed, done + failed + B).map(function (p) {
          var o = Object.assign({}, p); if (!o.created_at) delete o.created_at; return o;
        });
        return sb.from("items").insert(batch).then(function (res) {
          if (res.error) { failed += batch.length; $("status1").innerHTML = '<span class="err">실패: ' + res.error.message + "</span>"; }
          else done += batch.length;
          $("bar1").style.width = Math.round((done + failed) / todo.length * 100) + "%";
          if (!res.error) $("status1").textContent = (done + failed) + " / " + todo.length;
          return next();
        });
      }
      return next();
    });
  });

  function pageAll(build) {
    var all = [];
    function page(from) {
      return build().range(from, from + 999).then(function (res) {
        if (res.error) throw res.error;
        all = all.concat(res.data || []);
        if ((res.data || []).length === 1000) return page(from + 1000);
        return all;
      });
    }
    return page(0);
  }
  function loadExistingUrls() {
    return pageAll(function () { return sb.from("items").select("url").order("id"); })
      .then(function (rows) { var m = {}; rows.forEach(function (r) { m[r.url] = true; }); return m; });
  }

  // ---------- 2단계: 이미지 ----------
  var stopFlag = false;
  $("btn-stop").addEventListener("click", function () { stopFlag = true; this.disabled = true; });
  $("btn-images").addEventListener("click", function () {
    var btn = this; btn.disabled = true; stopFlag = false; $("btn-stop").disabled = false;
    $("status2").textContent = "대상 확인 중…";
    pageAll(function () { return sb.from("items").select("id,url,title").is("image", null).order("id"); }).then(function (list) {
      if (!list.length) { $("status2").textContent = "이미지가 비어 있는 아이템이 없습니다."; btn.disabled = false; $("btn-stop").disabled = true; return; }
      var i = 0, ok = 0, fail = 0, active = 0, CONC = 4;
      function update() {
        $("bar2").style.width = Math.round((ok + fail) / list.length * 100) + "%";
        $("status2").textContent = (ok + fail) + " / " + list.length + "  (성공 " + ok + ", 실패 " + fail + ")";
      }
      function finish() {
        $("status2").textContent = (stopFlag ? "중지됨: " : "완료: ") + "성공 " + ok + ", 실패 " + fail + " / 전체 " + list.length +
          (fail ? " — 실패한 곳은 쇼핑몰이 막아둔 경우가 많아요." : "");
        btn.disabled = false; $("btn-stop").disabled = true;
      }
      function worker() {
        if (stopFlag || i >= list.length) { if (active === 0) finish(); return; }
        var it = list[i++]; active++;
        fetch("/api/fetch-product?url=" + encodeURIComponent(it.url))
          .then(function (res) { return res.ok ? res.json() : null; })
          .catch(function () { return null; })
          .then(function (info) {
            if (info && info.image) {
              var patch = { image: info.image };
              if (!it.title && info.title) patch.title = info.title;
              return sb.from("items").update(patch).eq("id", it.id).then(function (r) { if (r.error) fail++; else ok++; });
            }
            fail++;
          })
          .then(function () { active--; update(); worker(); });
      }
      for (var k = 0; k < CONC; k++) worker();
    }).catch(function (e) { $("status2").innerHTML = '<span class="err">실패: ' + e.message + "</span>"; btn.disabled = false; });
  });
})();
</script>
</body>
</html>
