<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>위시함</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root { --bg:#fff; --fg:#111; --muted:#666; --border:#ccc; --border-light:#e5e5e5; --chip-bg:#f0f0f0; --danger:#b3261e; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--fg); }
  #root { min-height:100%; padding:16px; position:relative; }
  .hidden { display:none !important; }

  #login-view { max-width:340px; margin:18vh auto 0; text-align:left; }
  #login-view h1 { font-size:20px; margin:0 0 4px; }
  #login-view p.sub { color:var(--muted); font-size:13px; margin:0 0 20px; }
  .field { margin-bottom:12px; }
  .field label { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
  .field input { width:100%; padding:10px; border-radius:6px; border:1px solid var(--border); font-size:14px; }
  .btn { padding:10px; border-radius:6px; border:1px solid var(--border); font-size:14px; font-weight:500; cursor:pointer; background:#fff; }
  .btn.primary { background:var(--fg); color:#fff; border-color:var(--fg); }
  .btn.primary:disabled { opacity:.4; cursor:not-allowed; }
  .btn.ghost { background:#fff; color:var(--muted); }
  .row { display:flex; gap:8px; }
  .row .btn { flex:1; }
  #login-msg { font-size:13px; margin:10px 0; min-height:18px; }
  #login-msg.err { color:var(--danger); }
  #login-toggle { text-align:center; margin-top:14px; font-size:13px; color:var(--muted); }
  #login-toggle button { background:none; border:none; color:var(--fg); text-decoration:underline; cursor:pointer; font-size:13px; padding:0; }

  .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:12px; }
  .title { font-size:20px; font-weight:600; margin:0; }
  .sub { display:flex; align-items:center; gap:8px; }
  .count { font-size:12px; color:var(--muted); border:1px solid var(--border); padding:3px 8px; border-radius:4px; }
  .menu-btn { background:#fff; border:1px solid var(--border); width:28px; height:28px; border-radius:4px; cursor:pointer; font-size:16px; }
  .menu-panel { position:absolute; top:52px; right:16px; background:#fff; border:1px solid var(--border); border-radius:6px; z-index:40; min-width:180px; overflow:hidden; }
  .menu-item { display:block; width:100%; text-align:left; padding:9px 12px; background:none; border:none; border-bottom:1px solid var(--border-light); font-size:13.5px; cursor:pointer; }
  .menu-item:last-child { border-bottom:none; }
  .menu-email { padding:9px 12px; font-size:11.5px; color:var(--muted); border-bottom:1px solid var(--border-light); word-break:break-all; }

  .cat-row { display:flex; gap:6px; overflow-x:auto; margin-bottom:14px; }
  .cat-chip { flex:0 0 auto; font-size:12px; padding:5px 11px; border-radius:4px; border:1px solid var(--border); background:#fff; cursor:pointer; white-space:nowrap; }
  .cat-chip.active { background:var(--fg); border-color:var(--fg); color:#fff; }

  .empty { margin-top:15vh; text-align:center; color:var(--muted); font-size:14px; }

  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  @media (min-width:640px) { .grid { grid-template-columns:repeat(3,1fr); } }
  @media (min-width:980px) { .grid { grid-template-columns:repeat(5,1fr); } }

  .card { border:1px solid var(--border); border-radius:6px; padding:8px; position:relative; text-decoration:none; color:inherit; display:block; }
  .del-btn { position:absolute; top:4px; right:4px; width:20px; height:20px; border-radius:3px; background:#fff; border:1px solid var(--border); color:var(--muted); font-size:12px; line-height:1; cursor:pointer; z-index:3; }
  .thumb { width:100%; aspect-ratio:1/1; border-radius:4px; overflow:hidden; background:var(--chip-bg); display:flex; align-items:center; justify-content:center; margin-bottom:6px; }
  .thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .thumb-fallback { font-size:22px; color:var(--muted); }
  .price-tag { display:block; font-weight:600; font-size:13px; margin-bottom:3px; }
  .cat-pill { display:inline-block; font-size:10px; background:var(--chip-bg); padding:1px 6px; border-radius:3px; margin-bottom:4px; }
  .site { font-size:10.5px; color:var(--muted); display:block; margin-bottom:2px; }
  .name { font-size:13px; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

  .fab { position:fixed; right:18px; bottom:20px; width:52px; height:52px; border-radius:50%; background:var(--fg); color:#fff; border:none; font-size:24px; cursor:pointer; z-index:30; }

  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:50; display:flex; align-items:flex-end; justify-content:center; }
  .sheet { background:#fff; width:100%; max-width:480px; border-radius:12px 12px 0 0; padding:20px; max-height:85vh; overflow-y:auto; }
  .sheet h2 { font-size:17px; font-weight:600; margin:0 0 14px; }
  .hint { font-size:12.5px; color:var(--muted); margin:-4px 0 12px; line-height:1.5; }
  .hint.warn { color:var(--danger); }

  .confirm-overlay { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:60; display:flex; align-items:center; justify-content:center; padding:24px; }
  .confirm-box { background:#fff; border-radius:8px; padding:18px; max-width:320px; width:100%; text-align:center; }
  .confirm-box p { font-size:14px; margin:0 0 14px; }
  .banner { padding:9px 12px; border-radius:6px; font-size:12.5px; margin-bottom:12px; border:1px solid var(--border-light); background:var(--chip-bg); }
</style>
</head>
<body>
<div id="root">

  <div id="login-view">
    <h1>위시함</h1>
    <p class="sub">로그인하면 어느 기기에서든 같은 목록을 볼 수 있어요.</p>
    <div class="field"><label>이메일</label><input type="email" id="login-email" autocomplete="username" /></div>
    <div class="field"><label>비밀번호 (6자 이상)</label><input type="password" id="login-password" autocomplete="current-password" /></div>
    <div id="login-msg"></div>
    <button class="btn primary" id="login-submit" style="width:100%">로그인</button>
    <div id="login-toggle">계정이 없으신가요? <button id="to-signup">회원가입</button></div>
  </div>

  <div id="app-view" class="hidden">
    <div class="header">
      <h1 class="title">위시함</h1>
      <div class="sub">
        <span class="count" id="item-count">0개</span>
        <button class="menu-btn" id="menu-btn">⋯</button>
      </div>
    </div>
    <div id="menu-panel" class="menu-panel hidden">
      <div class="menu-email" id="menu-email"></div>
      <button class="menu-item" id="menu-clear">전체 삭제</button>
      <button class="menu-item" id="menu-logout">로그아웃</button>
    </div>
    <div id="cat-row" class="cat-row hidden"></div>
    <div id="storage-banner" class="banner hidden"></div>
    <div id="empty-view" class="empty hidden"></div>
    <div id="grid" class="grid"></div>
    <button class="fab" id="fab-add">+</button>
  </div>

  <div id="add-overlay" class="overlay hidden">
    <div class="sheet">
      <div id="add-step-input">
        <h2>상품 링크 담기</h2>
        <div class="field"><label>상품 페이지 주소</label><input type="text" id="url-input" inputmode="url" placeholder="https://..." /></div>
        <div class="row">
          <button class="btn ghost" id="skip-manual">직접 입력할게요</button>
          <button class="btn primary" id="fetch-info">정보 가져오기</button>
        </div>
      </div>
      <div id="add-step-preview" class="hidden">
        <h2>확인하고 저장하기</h2>
        <div id="fetch-fail-hint" class="hint warn hidden">이 사이트에서는 자동으로 정보를 가져오지 못했어요. 아래 항목을 직접 채워주세요.</div>
        <div class="thumb" id="preview-thumb" style="aspect-ratio:4/3; margin-bottom:12px;"></div>
        <div class="field"><label>이미지 주소 (선택)</label><input type="text" id="draft-image" /></div>
        <div class="field"><label>상품명</label><input type="text" id="draft-title" /></div>
        <div class="field"><label>가격 (숫자만, 선택)</label><input type="text" id="draft-price" inputmode="numeric" /></div>
        <div class="field"><label>사이트</label><input type="text" id="draft-site" /></div>
        <div class="field">
          <label>카테고리 (선택)</label>
          <input type="text" id="draft-category" list="cat-list" placeholder="예: 옷, 가전, 인테리어" />
          <datalist id="cat-list"></datalist>
        </div>
        <div class="row">
          <button class="btn ghost" id="back-to-input">뒤로</button>
          <button class="btn primary" id="save-draft">저장하기</button>
        </div>
      </div>
    </div>
  </div>

  <div id="confirm-delete" class="confirm-overlay hidden">
    <div class="confirm-box">
      <p>이 상품을 위시함에서 뺄까요?</p>
      <div class="row">
        <button class="btn ghost" id="cancel-delete">취소</button>
        <button class="btn primary" id="do-delete">빼기</button>
      </div>
    </div>
  </div>

  <div id="confirm-clear" class="confirm-overlay hidden">
    <div class="confirm-box">
      <p id="clear-msg"></p>
      <div class="row">
        <button class="btn ghost" id="cancel-clear">취소</button>
        <button class="btn primary" id="do-clear">전부 삭제</button>
      </div>
    </div>
  </div>

</div>

<script>
(function () {
  "use strict";

  var SUPABASE_URL = "https://ukjbqpezqzgfbmgtyltp.supabase.co";
  var SUPABASE_ANON_KEY = "sb_publishable_vziMDIRtG4w-jz9Uc3h0yA_clIQqKYD";
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  var items = [];
  var activeCategory = "all";
  var draft = null;
  var pendingDeleteId = null;
  var isSignupMode = false;

  function $(id) { return document.getElementById(id); }
  function escapeHtml(s) {
    return String(s || "").replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function normalizeUrl(raw) {
    var s = (raw || "").trim();
    if (!s) return "";
    if (!/^https?:\/\//i.test(s)) s = "https://" + s;
    return s;
  }
  function hostnameOf(url) {
    try { return new URL(url).hostname.replace(/^www\./, ""); } catch (e) { return ""; }
  }
  function formatPrice(price, currency) {
    if (!price) return "";
    var n = Number(String(price).replace(/[^0-9.]/g, ""));
    if (Number.isNaN(n)) return price;
    var cur = (currency || "").toUpperCase();
    if (cur === "USD") return "$" + n.toLocaleString();
    if (cur === "EUR") return "€" + n.toLocaleString();
    if (cur === "JPY") return "¥" + n.toLocaleString();
    return n.toLocaleString() + "원";
  }

  // ---------- 자동 정보 가져오기: 우리 자신의 서버 함수를 호출 ----------
  function fetchProductInfo(url) {
    return fetch("/api/fetch-product?url=" + encodeURIComponent(url))
      .then(function (res) { if (!res.ok) return null; return res.json(); })
      .catch(function () { return null; });
  }

  // ---------- 인증 ----------
  function showLogin() { $("login-view").classList.remove("hidden"); $("app-view").classList.add("hidden"); }
  function showApp() { $("login-view").classList.add("hidden"); $("app-view").classList.remove("hidden"); }
  function setLoginMsg(msg, isErr) { var el = $("login-msg"); el.textContent = msg || ""; el.className = isErr ? "err" : ""; }

  $("to-signup").addEventListener("click", function () {
    isSignupMode = !isSignupMode;
    $("login-submit").textContent = isSignupMode ? "회원가입" : "로그인";
    $("to-signup").textContent = isSignupMode ? "로그인" : "회원가입";
    document.querySelector("#login-toggle").firstChild.textContent = isSignupMode ? "이미 계정이 있으신가요? " : "계정이 없으신가요? ";
    setLoginMsg("");
  });

  $("login-submit").addEventListener("click", function () {
    var email = $("login-email").value.trim();
    var password = $("login-password").value;
    if (!email || password.length < 6) { setLoginMsg("이메일과 6자 이상 비밀번호를 입력해주세요.", true); return; }
    setLoginMsg(isSignupMode ? "가입 처리 중…" : "로그인 중…");
    var action = isSignupMode
      ? sb.auth.signUp({ email: email, password: password })
      : sb.auth.signInWithPassword({ email: email, password: password });
    action.then(function (res) {
      if (res.error) { setLoginMsg(res.error.message, true); return; }
      if (isSignupMode && res.data && res.data.user && !res.data.session) {
        setLoginMsg("가입 확인 이메일을 보냈어요. 메일함을 확인해서 인증해주세요.");
        return;
      }
      setLoginMsg("");
    });
  });

  sb.auth.onAuthStateChange(function (event, session) {
    if (session) {
      showApp();
      $("menu-email").textContent = session.user.email || "";
      loadItems();
    } else {
      showLogin();
    }
  });

  $("menu-logout").addEventListener("click", function () { sb.auth.signOut(); $("menu-panel").classList.add("hidden"); });

  // ---------- 데이터 ----------
  function loadItems() {
    sb.from("items").select("*").order("created_at", { ascending: false }).then(function (res) {
      if (res.error) { console.error(res.error); return; }
      items = res.data || [];
      render();
    });
  }
  function persistInsert(item) {
    return sb.from("items").insert(item).select().then(function (res) {
      if (res.error) { alert("저장 실패: " + res.error.message); return; }
      items = (res.data || []).concat(items);
      render();
    });
  }
  function persistDelete(id) {
    return sb.from("items").delete().eq("id", id).then(function (res) {
      if (res.error) { alert("삭제 실패: " + res.error.message); return; }
      items = items.filter(function (it) { return it.id !== id; });
      render();
    });
  }
  function persistClearAll() {
    var ids = items.map(function (it) { return it.id; });
    if (ids.length === 0) return Promise.resolve();
    return sb.from("items").delete().in("id", ids).then(function (res) {
      if (res.error) { alert("삭제 실패: " + res.error.message); return; }
      items = [];
      render();
    });
  }

  // ---------- 렌더링 ----------
  function getCategories() {
    var set = {}; var hasUncategorized = false;
    items.forEach(function (it) { if (it.category) set[it.category] = true; else hasUncategorized = true; });
    var list = Object.keys(set).sort(function (a, b) { return a.localeCompare(b, "ko"); });
    if (hasUncategorized) list.push("__uncategorized__");
    return list;
  }
  function getFiltered() {
    if (activeCategory === "all") return items;
    if (activeCategory === "__uncategorized__") return items.filter(function (it) { return !it.category; });
    return items.filter(function (it) { return it.category === activeCategory; });
  }

  function render() {
    $("item-count").textContent = items.length + "개";
    var cats = getCategories();
    var catRow = $("cat-row");
    if (cats.length === 0) { catRow.classList.add("hidden"); catRow.innerHTML = ""; }
    else {
      catRow.classList.remove("hidden");
      var html = '<button class="cat-chip' + (activeCategory === "all" ? " active" : "") + '" data-cat="all">전체</button>';
      cats.forEach(function (c) {
        var label = c === "__uncategorized__" ? "미분류" : c;
        html += '<button class="cat-chip' + (activeCategory === c ? " active" : "") + '" data-cat="' + escapeHtml(c) + '">' + escapeHtml(label) + "</button>";
      });
      catRow.innerHTML = html;
      catRow.querySelectorAll(".cat-chip").forEach(function (btn) {
        btn.addEventListener("click", function () { activeCategory = btn.getAttribute("data-cat"); render(); });
      });
    }

    var filtered = getFiltered();
    var emptyView = $("empty-view"); var grid = $("grid");
    if (items.length === 0) {
      emptyView.textContent = "아직 담긴 게 없어요. 오른쪽 아래 + 버튼으로 첫 상품을 담아보세요.";
      emptyView.classList.remove("hidden"); grid.innerHTML = ""; return;
    }
    if (filtered.length === 0) {
      emptyView.textContent = "이 카테고리엔 담긴 게 없어요.";
      emptyView.classList.remove("hidden"); grid.innerHTML = ""; return;
    }
    emptyView.classList.add("hidden");

    grid.innerHTML = filtered.map(function (it) {
      var priceHtml = it.price ? '<span class="price-tag">' + escapeHtml(formatPrice(it.price, it.currency)) + "</span>" : "";
      var catHtml = it.category ? '<span class="cat-pill">' + escapeHtml(it.category) + "</span>" : "";
      var imgHtml = it.image
        ? '<img src="' + escapeHtml(it.image) + '" alt="" loading="lazy" onerror="this.style.display=\'none\'" />'
        : '<span class="thumb-fallback">' + escapeHtml((it.site || "?")[0] || "?") + "</span>";
      return (
        '<a class="card" href="' + escapeHtml(it.url) + '" target="_blank" rel="noopener noreferrer">' +
        '<button class="del-btn" data-del="' + it.id + '" aria-label="삭제">×</button>' +
        '<div class="thumb">' + imgHtml + "</div>" +
        priceHtml + catHtml +
        '<span class="site">' + escapeHtml(it.site || "") + "</span>" +
        '<div class="name">' + escapeHtml(it.title || "") + "</div>" +
        "</a>"
      );
    }).join("");

    grid.querySelectorAll("[data-del]").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.preventDefault(); e.stopPropagation();
        pendingDeleteId = btn.getAttribute("data-del");
        $("confirm-delete").classList.remove("hidden");
      });
    });
  }

  // ---------- 메뉴 ----------
  $("menu-btn").addEventListener("click", function () { $("menu-panel").classList.toggle("hidden"); });
  document.addEventListener("click", function (e) {
    if (!$("menu-panel").contains(e.target) && e.target !== $("menu-btn")) $("menu-panel").classList.add("hidden");
  });
  $("menu-clear").addEventListener("click", function () {
    $("menu-panel").classList.add("hidden");
    $("clear-msg").textContent = "담아둔 " + items.length + "개를 전부 삭제할까요? 되돌릴 수 없어요.";
    $("confirm-clear").classList.remove("hidden");
  });
  $("cancel-clear").addEventListener("click", function () { $("confirm-clear").classList.add("hidden"); });
  $("do-clear").addEventListener("click", function () { persistClearAll(); $("confirm-clear").classList.add("hidden"); });
  $("cancel-delete").addEventListener("click", function () { $("confirm-delete").classList.add("hidden"); pendingDeleteId = null; });
  $("do-delete").addEventListener("click", function () {
    if (pendingDeleteId) persistDelete(pendingDeleteId);
    $("confirm-delete").classList.add("hidden"); pendingDeleteId = null;
  });

  // ---------- 추가 시트 ----------
  function openAddSheet() {
    $("url-input").value = "";
    $("add-step-input").classList.remove("hidden");
    $("add-step-preview").classList.add("hidden");
    $("add-overlay").classList.remove("hidden");
    setTimeout(function () { $("url-input").focus(); }, 50);
  }
  $("fab-add").addEventListener("click", openAddSheet);
  $("add-overlay").addEventListener("click", function (e) { if (e.target === $("add-overlay")) $("add-overlay").classList.add("hidden"); });

  function showPreview(d, failed) {
    draft = d;
    $("fetch-fail-hint").classList.toggle("hidden", !failed);
    $("draft-image").value = d.image || "";
    $("draft-title").value = d.title || "";
    $("draft-price").value = d.price || "";
    $("draft-site").value = d.site || "";
    $("draft-category").value = d.category || "";
    renderPreviewThumb();
    var catList = $("cat-list");
    catList.innerHTML = getCategories().filter(function (c) { return c !== "__uncategorized__"; })
      .map(function (c) { return '<option value="' + escapeHtml(c) + '"></option>'; }).join("");
    $("add-step-input").classList.add("hidden");
    $("add-step-preview").classList.remove("hidden");
  }
  function renderPreviewThumb() {
    var box = $("preview-thumb");
    var img = $("draft-image").value.trim();
    box.innerHTML = img
      ? '<img src="' + escapeHtml(img) + '" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display=\'none\'" />'
      : '<span class="thumb-fallback">' + escapeHtml(((draft && draft.site) || "?")[0] || "?") + "</span>";
  }
  $("draft-image").addEventListener("input", renderPreviewThumb);

  $("skip-manual").addEventListener("click", function () {
    var url = normalizeUrl($("url-input").value);
    if (!url) return;
    showPreview({ url: url, title: "", image: "", price: "", currency: "", site: hostnameOf(url), category: "" }, false);
  });

  $("fetch-info").addEventListener("click", function () {
    var url = normalizeUrl($("url-input").value);
    if (!url) return;
    var btn = $("fetch-info");
    btn.disabled = true; btn.textContent = "가져오는 중…";
    fetchProductInfo(url).then(function (info) {
      btn.disabled = false; btn.textContent = "정보 가져오기";
      if (info && (info.title || info.image || info.price)) {
        showPreview({ url: url, title: info.title, image: info.image, price: info.price, currency: info.currency, site: info.site || hostnameOf(url), category: "" }, false);
      } else {
        showPreview({ url: url, title: "", image: "", price: "", currency: "", site: hostnameOf(url), category: "" }, true);
      }
    });
  });

  $("back-to-input").addEventListener("click", function () {
    $("add-step-preview").classList.add("hidden");
    $("add-step-input").classList.remove("hidden");
  });

  $("save-draft").addEventListener("click", function () {
    if (!draft || !draft.url) return;
    var item = {
      url: draft.url,
      title: $("draft-title").value.trim() || $("draft-site").value.trim() || "제목 없음",
      image: $("draft-image").value.trim() || null,
      price: $("draft-price").value.trim() || null,
      currency: draft.currency || null,
      site: $("draft-site").value.trim() || hostnameOf(draft.url),
      category: $("draft-category").value.trim() || null
    };
    persistInsert(item);
    $("add-overlay").classList.add("hidden");
  });
})();
</script>
</body>
</html>
